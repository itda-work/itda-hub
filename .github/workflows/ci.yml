# 잇다 허브 CI — CSS 최신 여부, 단위(ruff · manage.py check · 마이그레이션 누락 · pytest)와 이미지 빌드.
# 라이브 스모크(just up → just smoke)와 커스텀 커넥터 OAuth 왕복은 여기서 하지 않는다(docs/deploy.md 「검증 절차」).
name: CI

# GitHub Actions 사용을 최소화한다 — 평소 검증은 로컬 `just check` 로 하고, 이 워크플로는 필요할 때만 수동 실행한다.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  css:
    name: Tailwind CSS 최신 여부
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: 의존성 설치
        run: bun install --frozen-lockfile

      - name: CSS 빌드
        run: bash scripts/build-css.sh

      # 템플릿에 새 Tailwind 클래스를 쓰고 CSS 를 다시 빌드하지 않으면 그 스타일이 통째로 빠진다.
      # 산출물을 커밋 대상으로 두는 대신 이 가드로 최신 여부를 지킨다(스킬.잇다 웹사이트와 같은 규약).
      # `git status --porcelain` 은 수정과 미추적을 모두 잡는다(`git diff` 는 미추적 파일에 조용하다).
      - name: 커밋된 CSS 가 최신인지 확인
        run: |
          drift="$(git status --porcelain -- static/css/hub.css)"
          if [ -n "$drift" ]; then
            echo "::error::static/css/hub.css 가 최신이 아니거나 커밋되지 않았다. 'just css' 후 커밋한다."
            echo "$drift"
            git diff -- static/css/hub.css | head -50
            exit 1
          fi

  check:
    name: just check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 파이썬 버전은 `.python-version` 이 정본이다(setup-uv·uv 가 읽는다) — 여기에 따로 적지 않는다.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: extractions/setup-just@v2

      - name: uv sync
        run: uv sync --frozen

      # 테스트 환경변수는 tests/settings.py 가 박는다. manage.py check 는 hub.settings 를 읽으므로 최소 값만 준다.
      - name: just check
        env:
          DJANGO_SECRET_KEY: ci-only
          HUB_LOCAL_LOGIN: '1'
        run: just check

  build:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: itda-hub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 이미지 안의 버전 확인
        run: docker run --rm --entrypoint python itda-hub:ci -c "import sys, django; print(sys.version); print('django', django.__version__)"
