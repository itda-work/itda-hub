# 잇다 허브 — 로컬 실행. 값은 .env 에서 온다(`just env` 가 만든다). 포트는 127.0.0.1 에만 연다.
# 운영은 같은 파일에 리버스 프록시(HTTPS 종단, /mcp → mcp:8080, 나머지 → web:8000)를 앞에 두면 된다(docs/deploy.md).
name: itda-hub
services:
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/hub.sqlite3
      # 내부 introspection 호출(mcp → web)의 Host 헤더가 web 이라 허용 목록에 넣는다.
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1},web
    ports: ['127.0.0.1:${HUB_WEB_PORT:-8000}:8000']
    volumes: ['hub-data:/data']
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
  mcp:
    build: .
    command: ['python', '-m', 'mcp_server']
    env_file: .env
    environment:
      HUB_ROLE: mcp
      DATABASE_URL: sqlite:////data/hub.sqlite3
      HUB_MCP_BIND: 0.0.0.0:8080
      # 공개 주소(localhost)는 컨테이너 안에서 자기 자신이다 — 토큰 검증은 서비스 이름으로 web 에 간다.
      HUB_INTROSPECTION_URL: http://web:8000/o/introspect/
    ports: ['127.0.0.1:${HUB_MCP_PORT:-8080}:8080']
    volumes: ['hub-data:/data']
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
volumes:
  hub-data: {}
