{% load allauth %}
{# 입력 칸 모양은 .hub-form(static/src/tailwind.css)이 입힌다 — 위젯에 클래스를 줄 수 없는 allauth 폼도 같은 모양이 된다. #}
<form method="{{ attrs.method }}" class="hub-form mt-6"
      {% if attrs.action %}action="{{ attrs.action }}"{% endif %}>
    {% slot body %}
    {% endslot %}
    <div class="mt-6 flex flex-col gap-2">
    {% slot actions %}
    {% endslot %}
    </div>
</form>
