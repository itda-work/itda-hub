{% load static %}<!doctype html>
{% comment %}
  공통 셸 — 스킬.잇다 웹사이트(templates/base.html · partials/header·footer)와 같은 계열.

  - CSS 는 static/css/hub.css 하나(just css 로 빌드해 커밋). 인라인 <style> 없음.
  - **인라인 <script>·on*= 속성 금지.** 테마 가드는 <head> 의 동기 파일(theme-boot.js), 나머지는 hub.js(defer).
    tests/test_templates_static.py 가 템플릿 전체를 검사한다.
  - 블록: title · extra_head · content · extra_body. main_class 로 본문 폭을 바꾼다(기본 max-w-5xl),
    main_inner 는 content 를 감싸는 틀(allauth 레이아웃이 카드로 감싼다).
{% endcomment %}
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="{% static 'js/theme-boot.js' %}"></script>
<title>{% block title %}잇다 허브{% endblock %}</title>
<link rel="icon" type="image/png" href="{% static 'img/logo.png' %}">
<link rel="apple-touch-icon" href="{% static 'img/logo.png' %}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="{% static 'css/hub.css' %}">
<script src="{% static 'js/hub.js' %}" defer></script>
{% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col">
<a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-3 focus:z-[60] btn btn-primary">본문으로 건너뛰기</a>
{% with ns=request.resolver_match.namespace %}
<header class="sticky top-0 z-50 bg-white/90 dark:bg-slate-900/90 backdrop-blur border-b border-gray-100 dark:border-slate-800">
  <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center gap-x-6 gap-y-2">
    <a href="{% url 'toolbox:home' %}" class="flex items-center gap-2 font-bold text-lg text-gray-900 dark:text-white hover:text-blue-600 dark:hover:text-blue-400 transition-colors tracking-tight whitespace-nowrap">
      <img src="{% static 'img/logo.png' %}" alt="" class="h-7 w-7" width="28" height="28">
      잇다 허브
    </a>
    <nav aria-label="주 메뉴" class="order-3 w-full sm:order-none sm:w-auto flex items-center gap-5 overflow-x-auto">
      <a href="{% url 'toolbox:home' %}" class="text-sm font-medium transition-colors {% if ns == 'toolbox' %}text-gray-900 dark:text-white{% else %}text-gray-500 dark:text-slate-400 hover:text-gray-900 dark:hover:text-white{% endif %}"{% if ns == 'toolbox' %} aria-current="page"{% endif %}>도구함</a>
      <a href="{% url 'trajectory:mine' %}" class="text-sm font-medium transition-colors {% if ns == 'trajectory' %}text-gray-900 dark:text-white{% else %}text-gray-500 dark:text-slate-400 hover:text-gray-900 dark:hover:text-white{% endif %}"{% if ns == 'trajectory' %} aria-current="page"{% endif %}>궤적</a>
      {% if user.is_staff %}<a href="{% url 'admin:index' %}" class="text-sm font-medium text-gray-500 dark:text-slate-400 hover:text-gray-900 dark:hover:text-white transition-colors">관리자</a>{% endif %}
    </nav>
    <div class="ml-auto flex items-center gap-2">
      {% if user.is_authenticated %}
        <span class="hidden sm:inline max-w-[16rem] truncate text-sm text-gray-500 dark:text-slate-400" title="{{ user.email }}">{{ user.email }}</span>
        <form method="post" action="{% url 'account_logout' %}">{% csrf_token %}<button type="submit" class="btn btn-ghost px-3 py-1.5">로그아웃</button></form>
      {% else %}
        <a href="{% url 'account_login' %}" class="btn btn-secondary px-3 py-1.5">로그인</a>
      {% endif %}
      <button type="button" id="theme-toggle" aria-label="다크 모드 전환" aria-pressed="false" class="p-2 rounded-lg text-gray-400 dark:text-slate-500 hover:bg-gray-100 dark:hover:bg-slate-800 transition-colors">
        <svg class="h-4 w-4 dark:hidden" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        <svg class="h-4 w-4 hidden dark:block" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
      </button>
    </div>
  </div>
</header>
{% endwith %}

<main id="main" class="flex-1 w-full {% block main_class %}max-w-5xl{% endblock %} mx-auto px-4 py-8 sm:py-10">
  {% if messages %}
  <div class="mb-6 space-y-2" role="status" aria-live="polite">
    {% for m in messages %}
    <div class="rounded-lg border px-4 py-3 text-sm {% if m.level_tag == 'error' %}border-red-200 bg-red-50 text-red-800 dark:border-red-900/60 dark:bg-red-950/40 dark:text-red-200{% elif m.level_tag == 'warning' %}border-amber-200 bg-amber-50 text-amber-900 dark:border-amber-900/60 dark:bg-amber-950/40 dark:text-amber-200{% elif m.level_tag == 'success' %}border-emerald-200 bg-emerald-50 text-emerald-800 dark:border-emerald-900/60 dark:bg-emerald-950/40 dark:text-emerald-200{% else %}border-blue-200 bg-blue-50 text-blue-800 dark:border-blue-900/60 dark:bg-blue-950/40 dark:text-blue-200{% endif %}">{{ m }}</div>
    {% endfor %}
  </div>
  {% endif %}
  {% block main_inner %}{% block content %}{% endblock %}{% endblock %}
</main>

<footer class="border-t border-gray-100 dark:border-slate-800 py-8 mt-12 bg-white dark:bg-slate-900">
  <div class="max-w-5xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3 text-sm text-gray-500 dark:text-slate-400">
    <div class="flex flex-wrap items-center justify-center gap-x-2 gap-y-1">
      <a href="https://itda.work" class="hover:text-gray-900 dark:hover:text-white transition-colors">스킬.잇다</a>
      <span class="text-gray-300 dark:text-slate-700" aria-hidden="true">·</span>
      <span class="whitespace-nowrap">Powered by
        <a href="https://www.python.org/" target="_blank" rel="noopener noreferrer" class="hover:text-gray-900 dark:hover:text-white transition-colors">Python</a>
        <span class="text-gray-300 dark:text-slate-700 mx-0.5" aria-hidden="true">·</span>
        <a href="https://www.djangoproject.com/" target="_blank" rel="noopener noreferrer" class="hover:text-gray-900 dark:hover:text-white transition-colors">Django</a></span>
    </div>
    <a href="https://github.com/itda-work/itda-hub" target="_blank" rel="noopener noreferrer" class="hover:text-gray-900 dark:hover:text-white transition-colors">오픈소스 · GitHub</a>
  </div>
</footer>
{% block extra_body %}{% endblock %}
</body>
</html>
