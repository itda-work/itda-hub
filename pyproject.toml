[project]
name = "itda-hub"
version = "0.5.4"
description = "잇다 허브 — 도구함을 골라 담고 한 번의 로그인으로 Claude·Cowork 에 연결하는 오픈소스 MCP 허브 서비스 (Django · django-itda · fastmcp)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "itda-work", email = "dev@itda.work" }]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1,<6.2",
    "django-itda>=0.4.0",
    "django-allauth[socialaccount]>=65.19",
    "django-oauth-toolkit>=3.4.1,<4",
    "fastmcp>=4,<5",
    "httpx>=0.28",
    "cryptography>=45",
    "whitenoise>=6.9",
    "uvicorn[standard]>=0.34",
    "gunicorn>=23",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.11",
    "ruff>=0.12",
    # 도구 키 문서의 앵커가 코드 예시인지 진짜 절인지는 렌더러가 답한다(tests/test_tool_key_docs.py).
    "markdown-it-py>=3",
]

[tool.uv.sources]
django-itda = { git = "https://github.com/itda-work/django-itda", tag = "v0.4.0" }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
# 폐기 경고는 실패로 — "항상 최신 안정판" 이라 의존성이 올라갈 때 여기서 먼저 드러나야 한다.
# whitenoise 의 "No directory at" 은 테스트가 collectstatic 없이 도는 탓이라 끈다(운영 이미지는 굽는다).
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    "ignore:No directory at:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# Django 관용구(Meta 의 리스트·마이그레이션 필드 목록)는 가변 클래스 속성이 정상이다.
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["E501", "RUF012"]
