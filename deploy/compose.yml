# 잇다 허브 — 운영 배포 골격. 실제 값은 .env(서버에만)에서 온다.
services:
  web:
    build: ..
    command: gunicorn hub.wsgi:application --bind 0.0.0.0:8000 --workers 2
    env_file: [../.env]
    volumes: ['hub-data:/data']
    restart: unless-stopped
  mcp:
    build: ..
    command: python -m mcp_server
    env_file: [../.env]
    environment:
      HUB_MCP_BIND: 0.0.0.0:8080
    volumes: ['hub-data:/data']
    restart: unless-stopped
  # 리버스 프록시(Caddy 등)가 /mcp 는 mcp:8080 으로, 나머지는 web:8000 으로 보낸다. HTTPS 종단은 프록시가 맡는다.
volumes:
  hub-data: {}
